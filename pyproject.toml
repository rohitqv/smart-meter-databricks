[project]
name = "smart-meter-databricks"
version = "0.1.0"
description = "Smart-grid meter pipeline on Databricks Free Edition"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "faker>=24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "databricks-sdk>=0.20",
]

[tool.setuptools.packages.find]
include = ["ingestion", "ingestion.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
