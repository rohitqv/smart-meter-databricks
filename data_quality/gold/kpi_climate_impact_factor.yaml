# data_quality/gold/kpi_climate_impact_factor.yaml

- check:
    function: is_not_null
    arguments:
      column: zip_code
  name: zip_code_not_null
  criticality: error

- check:
    function: is_not_null
    arguments:
      column: reading_date
  name: reading_date_not_null
  criticality: error

- check:
    function: is_in_range
    arguments:
      column: climate_impact_factor
      min_limit: -10.0
      max_limit: 10.0
  name: climate_impact_factor_plausible
  criticality: warn
